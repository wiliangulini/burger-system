name: CI

on:
  pull_request:
    branches:
      - dev
      - main
  push:
    branches:
      - dev
      - main

jobs:
  validate:
    name: Lint, typecheck, test and build
    runs-on: ubuntu-latest
    env:
      # Non-secret placeholder: E02 only needs a valid URL to generate Prisma Client.
      DATABASE_URL: postgresql://ci_user:ci_password@127.0.0.1:5432/burger_system_ci?schema=public

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test -- --runInBand

      - name: Build
        run: npm run build
